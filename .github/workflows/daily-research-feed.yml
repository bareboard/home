name: Build UMS LIVE research feed

on:
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'

permissions:
  contents: write

jobs:
  source-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Build source-attributed article feed
        run: python3 scripts/build_article_feed.py
      - name: Build transparent evidence signals
        run: python3 scripts/build_evidence_signals.py
      - name: Build current mineral market snapshot
        run: python3 scripts/build_market_snapshot.py
      - name: Build sector heatmap data
        run: python3 scripts/build_sector_heatmap.py
      - name: Commit refreshed research data
        run: |
          git config user.name "UMS LIVE Research Bot"
          git config user.email "research-bot@users.noreply.github.com"
          git add data/daily-articles.json data/market-snapshot.json data/sector-heatmap.json
          git diff --cached --quiet || git commit -m "Update UMS LIVE research feed"
          git push origin HEAD:${{ github.ref_name }}

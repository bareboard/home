name: Daily Dig — Critical Minerals Intelligence

on:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-dig
  cancel-in-progress: false

jobs:
  dig:
    name: Fetch data → generate AI articles → commit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run the Daily Dig
        run: python3 scripts/dig.py

      - name: Generate server-side AI articles + Founder's quote
        run: python3 scripts/synthesize.py
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}

      - name: Verify data file
        run: |
          python3 -c "import json; json.load(open('data/raw-industrial.json')); print('raw-industrial.json OK')"

      - name: Commit fresh data (only if changed)
        run: |
          git config user.name "cambreth-dig-bot"
          git config user.email "dig-bot@users.noreply.github.com"
          git add data/raw-industrial.json
          if git diff --cached --quiet; then
            echo "No data change — nothing to commit."
          else
            git commit -m "Daily dig: refresh raw-industrial.json ($(date -u +%Y-%m-%dT%H:%MZ))"
            git push
            echo "Committed fresh data."
          fi

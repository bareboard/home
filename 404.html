<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><title>Bareboard</title></head>
<body>
<script>
  // GitHub Pages clean-URL redirect: preserve the requested path so the
  // single-page app can render the right page with a clean address.
  try { sessionStorage.setItem("bareboard-redirect", location.pathname); } catch (e) {}
  location.replace("./");
</script>
</body>
</html>
